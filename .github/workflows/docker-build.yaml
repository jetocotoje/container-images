name: Build and push Docker images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      merge-matrix: ${{ steps.build-matrix.outputs.merge_matrix }}
      has-work: ${{ steps.build-matrix.outputs.has_work }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: build-matrix
        name: Generate build matrix
        run: python3 .github/scripts/build_matrix.py
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          BEFORE_SHA: ${{ github.event.before || '' }}

  build:
    needs: generate-matrix
    runs-on: ${{ matrix.runner }}
    if: ${{ needs.generate-matrix.outputs.has-work == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate upstream version pins for ${{ matrix.name }}
        run: python3 .github/scripts/validate_upstream_versions.py --service-dir "${{ matrix.dir }}" --dockerfile "${{ matrix.dockerfile }}"

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            # Always sha tag
            type=sha
            # latest only on main (optional; adjust as you like)
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image refs for ${{ matrix.name }}
        id: refs
        env:
          PR_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          image="$(printf '%s/%s/%s' "${REGISTRY}" "${IMAGE_PREFIX}" "${{ matrix.name }}" | tr '[:upper:]' '[:lower:]')"
          cache_ref="$(printf '%s/%s/buildcache' "${REGISTRY}" "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]'):${{ matrix.name }}-${{ matrix.slug }}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "cache_ref=${cache_ref}" >> "$GITHUB_OUTPUT"
          # Fork PRs run with a read-only GITHUB_TOKEN and cannot push the cache.
          if [ "${PR_FORK}" != "true" ]; then
            echo "cache_to=type=registry,mode=max,ref=${cache_ref}" >> "$GITHUB_OUTPUT"
          fi
          if [ "${PUSH}" = "true" ]; then
            echo "outputs=type=image,name=${image},push-by-digest=true,name-canonical=true,push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ${{ matrix.name }} (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: ${{ steps.refs.outputs.outputs }}
          cache-from: type=registry,ref=${{ steps.refs.outputs.cache_ref }}
          cache-to: ${{ steps.refs.outputs.cache_to }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export digest
        if: ${{ env.PUSH == 'true' }}
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          echo "${digest#sha256:}" > "/tmp/digests/${{ matrix.slug }}"

      - name: Upload digest
        if: ${{ env.PUSH == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.slug }}-${{ matrix.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [generate-matrix, build]
    runs-on: ubuntu-latest
    if: ${{ needs.generate-matrix.outputs.has-work == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.merge-matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download digests for ${{ matrix.name }}
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*-${{ matrix.name }}
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version-based tags for ${{ matrix.name }}
        id: tmpl
        run: |
          raw_image="${REGISTRY}/${IMAGE_PREFIX}/${{ matrix.name }}"
          python3 .github/scripts/render_extra_tags.py \
            --service-dir "${{ matrix.dir }}" \
            --dockerfile "${{ matrix.dockerfile }}" \
            --image "$(echo "$raw_image" | tr '[:upper:]' '[:lower:]')"

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            # Always sha tag
            type=sha
            # latest only on main (optional; adjust as you like)
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Merge multi-platform manifest for ${{ matrix.name }}
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
          EXTRA_TAGS: ${{ steps.tmpl.outputs.extra_tags }}
        run: |
          image="$(printf '%s/%s/%s' "${REGISTRY}" "${IMAGE_PREFIX}" "${{ matrix.name }}" | tr '[:upper:]' '[:lower:]')"
          all_tags="$(printf '%s\n%s' "${META_TAGS}" "${EXTRA_TAGS}")"
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=( -t "$tag" )
          done <<< "$all_tags"
          digest_args=()
          for digest_file in /tmp/digests/*; do
            [ -f "$digest_file" ] && digest_args+=( "${image}@sha256:$(cat "$digest_file")" )
          done
          if [ "${#digest_args[@]}" -eq 0 ]; then
            echo "No digests found for ${image}" >&2
            exit 1
          fi
          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"
