name: Build and push Docker images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild the scheduledRebuild services without cache and smoke-test them (publishes from main)
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}
  REBUILD: ${{ github.event_name == 'schedule' || inputs.rebuild == true }}
  PUSH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || inputs.rebuild == true) }}

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      merge-matrix: ${{ steps.build-matrix.outputs.merge_matrix }}
      has-work: ${{ steps.build-matrix.outputs.has_work }}
      push: ${{ env.PUSH }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: build-matrix
        name: Generate build matrix
        run: python3 .github/scripts/build_matrix.py
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          BEFORE_SHA: ${{ github.event.before || '' }}

  build:
    needs: generate-matrix
    runs-on: ${{ matrix.runner }}
    if: ${{ needs.generate-matrix.outputs.has-work == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate upstream version pins for ${{ matrix.name }}
        run: python3 .github/scripts/validate_upstream_versions.py --service-dir "${{ matrix.dir }}" --dockerfile "${{ matrix.dockerfile }}"

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            # Always sha tag
            type=sha
            # latest only on main (optional; adjust as you like)
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image refs for ${{ matrix.name }}
        id: refs
        env:
          PR_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          image="$(printf '%s/%s/%s' "${REGISTRY}" "${IMAGE_PREFIX}" "${{ matrix.name }}" | tr '[:upper:]' '[:lower:]')"
          cache_ref="$(printf '%s/%s/buildcache' "${REGISTRY}" "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]'):${{ matrix.name }}-${{ matrix.slug }}"
          push_outputs="type=image,name=${image},push-by-digest=true,name-canonical=true,push=true"
          cache_to=""
          # Fork PRs run with a read-only GITHUB_TOKEN and cannot push the cache.
          if [ "${PR_FORK}" != "true" ]; then
            cache_to="type=registry,mode=max,ref=${cache_ref}"
          fi
          {
            echo "image=${image}"
            if [ "${REBUILD}" != "true" ]; then
              echo "cache_from=type=registry,ref=${cache_ref}"
            fi
            if [ "${{ matrix.smoke }}" = "true" ]; then
              # Only a smoke-tested build may reach the registry, its cache included.
              smoke_image="smoke-${{ matrix.name }}:${{ matrix.slug }}"
              echo "smoke_image=${smoke_image}"
              echo "build_outputs=type=docker,name=${smoke_image}"
              echo "push_outputs=${push_outputs}"
              echo "push_cache_to=${cache_to}"
            else
              echo "build_cache_to=${cache_to}"
              if [ "${PUSH}" = "true" ]; then
                echo "build_outputs=${push_outputs}"
                echo "build_sbom=true"
              fi
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.name }} (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: ${{ steps.refs.outputs.build_outputs }}
          no-cache: ${{ env.REBUILD == 'true' }}
          cache-from: ${{ steps.refs.outputs.cache_from }}
          cache-to: ${{ steps.refs.outputs.build_cache_to }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: ${{ steps.refs.outputs.build_sbom == 'true' }}

      - name: Smoke-test ${{ matrix.name }} (${{ matrix.platform }})
        if: ${{ matrix.smoke == 'true' }}
        run: python3 .github/scripts/smoke_test.py --service-dir "${{ matrix.dir }}" --image "${{ steps.refs.outputs.smoke_image }}"

      - name: Push ${{ matrix.name }} (${{ matrix.platform }})
        id: push
        if: ${{ matrix.smoke == 'true' && env.PUSH == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: ${{ steps.refs.outputs.push_outputs }}
          cache-to: ${{ steps.refs.outputs.push_cache_to }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true

      - name: Export digest
        if: ${{ env.PUSH == 'true' }}
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          PUSH_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          digest="${BUILD_DIGEST}"
          if [ "${{ matrix.smoke }}" = "true" ]; then
            digest="${PUSH_DIGEST}"
          fi
          if [ -z "${digest}" ]; then
            echo "No pushed digest for ${{ matrix.name }} (${{ matrix.platform }})" >&2
            exit 1
          fi
          mkdir -p /tmp/digests
          echo "${digest#sha256:}" > "/tmp/digests/${{ matrix.slug }}"

      - name: Upload digest
        if: ${{ env.PUSH == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-${{ matrix.slug }}-${{ matrix.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [generate-matrix, build]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.generate-matrix.outputs.has-work == 'true' && needs.generate-matrix.outputs.push == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.merge-matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download digests for ${{ matrix.name }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: /tmp/digests
          pattern: digests-*-${{ matrix.name }}
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version-based tags for ${{ matrix.name }}
        id: tmpl
        run: |
          raw_image="${REGISTRY}/${IMAGE_PREFIX}/${{ matrix.name }}"
          python3 .github/scripts/render_extra_tags.py \
            --service-dir "${{ matrix.dir }}" \
            --dockerfile "${{ matrix.dockerfile }}" \
            --image "$(echo "$raw_image" | tr '[:upper:]' '[:lower:]')"

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            # Always sha tag
            type=sha
            # latest only on main (optional; adjust as you like)
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Merge multi-platform manifest for ${{ matrix.name }}
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
          EXTRA_TAGS: ${{ steps.tmpl.outputs.extra_tags }}
          PLATFORMS: ${{ matrix.platforms }}
        run: |
          image="$(printf '%s/%s/%s' "${REGISTRY}" "${IMAGE_PREFIX}" "${{ matrix.name }}" | tr '[:upper:]' '[:lower:]')"
          all_tags="$(printf '%s\n%s' "${META_TAGS}" "${EXTRA_TAGS}")"
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=( -t "$tag" )
          done <<< "$all_tags"
          digest_args=()
          IFS=, read -ra platforms <<< "${PLATFORMS}"
          for platform in "${platforms[@]}"; do
            digest_file="/tmp/digests/${platform//\//-}"
            if [ ! -f "$digest_file" ]; then
              echo "No ${platform} digest for ${image}; not publishing it" >&2
              exit 1
            fi
            digest_args+=( "${image}@sha256:$(cat "$digest_file")" )
          done
          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"
